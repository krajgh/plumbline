schema = 1
name = "default"
inputs = ["request", "diff"]            # available before any stage runs
generated = ["graft/**", "**/*.lock", "pnpm-lock.yaml", "package-lock.json", "uv.lock", "poetry.lock"]
precedence = ["code", "config", "tests", "docs"]   # when a change touches several types, the first decides its row

[sizes]            # changed lines (added + removed) outside `generated`
S = 50             # S: at most 50
M = 400            # M: at most 400; L: more

# File types, tried in order; a file takes the first that matches.
[[type]]
id = "docs"
paths = ["**/*.md", "**/*.rst", "**/*.txt", "docs/**", "LICENSE", "NOTICE"]
[[type]]
id = "tests"
paths = ["tests/**", "test/**", "**/test_*.py", "**/*_test.py", "**/*.test.*", "**/*.spec.*"]
[[type]]
id = "config"
paths = [".github/**", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.json", "**/Dockerfile", "**/.gitignore"]
[[type]]
id = "code"
paths = ["**"]

[[stage]]
id = "intake"
role = "main"
reads = ["request", "diff"]
record = "change_class"

[[stage]]
id = "plan"
role = "planner"
reads = ["request", "intake"]
record = "spec"
gate = "spec_complete"
on_fail = "plan"                # the planner runs again with the gate's problems
max_rounds = 2

[[stage]]
id = "spec-review"
kind = "review"                 # a review unit that checks the spec against the request: nothing else does, and everything after it is checked against the spec
target = "plan"
reads = ["request", "plan"]     # the request as `plan --request-file` stored it
record = "review_record"
lenses = ["requirements"]
defenders = 3
survive_if_unrefuted_by = 2
screen_defenders = 1
detective = false
gate = "no_surviving_blockers"
on_fail = "plan"                # the planner runs again with the surviving findings
max_rounds = 2

[[stage]]
id = "tests"
role = "test-writer"
reads = ["plan"]
record = "tests_record"
gate = "tests_fail_on_stub"     # measured: `gate` runs the repository's test command itself, which must fail while the code is missing (exit 1, at run time, never at collection)
on_fail = "tests"               # the test-writer runs again with the gate's problems
max_rounds = 3

[[stage]]
id = "test-review"
kind = "review"                 # a review unit: prosecutors, then defenders, then a detective
target = "tests"                # the stage whose output is under review
reads = ["plan", "tests"]
record = "review_record"
lenses = ["tests"]
gate = "no_surviving_blockers"
on_fail = "tests"
max_rounds = 2

[[stage]]
id = "build"
role = "builder"
reads = ["plan"]                # never the tests
record = "build_note"

[[stage]]
id = "verify"
role = "verifier"
reads = ["diff", "tests?", "build?"]
record = "verify_record"
gate = "verify_green"           # measured: `gate` runs the repository's [commands] itself and compares the verifier's record with what happened
on_fail = "build"
max_rounds = 3

[[stage]]
id = "review"
kind = "review"
target = "diff"
reads = ["diff", "plan?", "verify"]
record = "review_record"
lenses = ["correctness", "tests", "security", "data", "boundaries"]
defenders = 3
survive_if_unrefuted_by = 2     # a blocker stands when at least 2 of the 3 defenders fail to refute it
screen_defenders = 1            # the panel of 3 defends only when a prosecutor filed a BLOCKING finding; otherwise 1 screening defender answers every finding (0: none runs, and every finding stands)
detective = true                # runs only once no blocker stands
gate = "no_surviving_blockers"
on_fail = "build"
max_rounds = 3

[[stage]]
id = "reduce"
role = "main"
reads = ["intake", "verify?", "review?"]   # reduces whatever the row produced
record = "pass_record"
gate = "all_gates_passed"

# Rows: which stages run for which change. A row selects stages; it never reorders them.
# Reordering means reordering the [[stage]] blocks above.
# A row may set on_fail = { <stage> = "<a stage of the row, or main>" }: where a failed gate of that stage sends the run in
# this row, in place of the stage's own on_fail. The docs, config and tests rows have no build stage, so their verify and review
# send the run to the main session, which brings the problems to the builder. A stage whose own on_fail names a stage the row
# lacks, with no on_fail of the row to say otherwise, fails over to main all the same, and validate-pipeline notes it.
[matrix.docs]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["docs"]
on_fail = { verify = "main", review = "main" }

[matrix.config]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["security", "boundaries"]
on_fail = { verify = "main", review = "main" }

[matrix.tests]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["tests"]
on_fail = { verify = "main", review = "main" }

[matrix.code.S]
stages = ["intake", "plan", "tests", "build", "verify", "review", "reduce"]
lenses = ["correctness", "tests"]

# spec-review is in the rows of size M and L: a spec of size S has one or two criteria, and the review of a spec that short costs more than it finds.
[matrix.code.M]
stages = ["intake", "plan", "spec-review", "tests", "test-review", "build", "verify", "review", "reduce"]

[matrix.code.L]
stages = ["intake", "plan", "spec-review"]
note = "The planner proposes a split into changes of size M or smaller; nothing is built at size L."

# Role policies: what each agent may write and run. A PreToolUse hook enforces them for plumbline agents.
#   writes:   record = the role's own records under .plumbline/runs/; tests = the tests type above;
#             stubs = the active run's stubs directory, .plumbline/runs/<run-id>/stubs/: where the test-writer puts the
#             stubs of brand-new modules, outside the change (never measured, never committed) and hidden from the builder;
#             code = everything else, except .plumbline/, plumbline.toml and pipeline files
#   commands: test, lint, typecheck and build are the repo's [commands] in plumbline.toml (command prefixes);
#             git-read is read-only git (diff, show, log, status, rev-parse, merge-base, ls-files, grep, blame);
#             search is read-only shell tools (grep, rg, cat, head, tail, wc, sed -n, ls, find without -exec or -delete);
#             plumbline-check is `plumbline.py check-diff`; graft is the graft wrapper, where graft is on.
#             A role with no commands has no Bash at all (`plumbline.py check-record` is allowed to every role that has some).
[roles.planner]
writes = ["record"]
commands = ["git-read", "search", "graft"]

[roles.test-writer]
writes = ["record", "tests", "stubs"]
commands = ["test", "git-read", "search"]

[roles.builder]
writes = ["record", "code"]
commands = []                   # its agent has no Bash tool

[roles.verifier]
writes = ["record"]
commands = ["test", "lint", "typecheck", "build", "git-read", "search", "plumbline-check"]

[roles.prosecutor]
writes = ["record"]
commands = ["git-read", "search", "graft"]

[roles.defender]
writes = ["record"]
commands = ["git-read", "search"]

[roles.detective]
writes = ["record"]
commands = ["git-read", "search", "graft"]

[roles.canary]                  # runs only in a calibration run, beside the prosecutors: writes prosecutor-canary.json and canary-key.json in the round directory, and nothing else
writes = ["record"]
commands = ["git-read", "search"]

# Intents: why a change is made, next to its type and size. The row selects stages; the intent then
# removes stages (skip), or supplies the record a removed stage would have written (supplies), which is
# validated against that stage's schema at intake. `gates` replaces a stage's gate, `lenses` the lenses
# of the review of the diff. After an intent is applied to a row, every required read must be produced
# by a stage left in the row or listed in `supplies`.
[intent.feature]                # the default: the planner writes the spec
skip = []

[intent.spec-supplied]          # the builder or an issue supplies the spec
skip = ["plan"]
supplies = ["plan"]

[intent.fix]                    # reproduce first
skip = ["plan"]
supplies = ["plan"]             # a one-AC spec from the bug report: "this no longer happens"
gates = { tests = "reproduces_on_head" }   # the new tests must fail on today's code, on an assertion

[intent.refactor]               # behaviour unchanged
skip = ["plan", "spec-review", "tests", "test-review"]   # the template spec says "behaviour unchanged": there is no request to compare it with
supplies = ["plan"]             # the shipped template spec (pipeline/templates/refactor.json): behaviour unchanged, every existing test passes
lenses = ["correctness", "boundaries"]

[intent.review-only]            # a change that already exists: nothing is built
skip = ["plan", "spec-review", "tests", "test-review", "build"]
