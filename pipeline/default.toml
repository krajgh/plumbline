schema = 1
name = "default"
inputs = ["request", "diff"]            # available before any stage runs
generated = ["graft/**", "**/*.lock", "pnpm-lock.yaml", "package-lock.json", "uv.lock", "poetry.lock"]
precedence = ["code", "config", "tests", "docs"]   # when a change touches several types, the first decides its row

[sizes]            # changed lines (added + removed) outside `generated`
S = 50             # S: at most 50
M = 400            # M: at most 400; L: more

# File types, tried in order; a file takes the first that matches.
[[type]]
id = "docs"
paths = ["**/*.md", "**/*.rst", "**/*.txt", "docs/**", "LICENSE", "NOTICE"]
[[type]]
id = "tests"
paths = ["tests/**", "test/**", "**/test_*.py", "**/*_test.py", "**/*.test.*", "**/*.spec.*"]
[[type]]
id = "config"
paths = [".github/**", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.json", "**/Dockerfile", "**/.gitignore"]
[[type]]
id = "code"
paths = ["**"]

[[stage]]
id = "intake"
role = "main"
reads = ["request", "diff"]
record = "change_class"

[[stage]]
id = "plan"
role = "planner"
reads = ["request", "intake"]
record = "spec"
gate = "spec_complete"

[[stage]]
id = "tests"
role = "test-writer"
reads = ["plan"]
record = "tests_record"
gate = "acs_covered"

[[stage]]
id = "test-review"
kind = "review"                 # a review unit: prosecutors, then defenders, then a detective
target = "tests"                # the stage whose output is under review
reads = ["plan", "tests"]
record = "review_record"
lenses = ["tests"]
gate = "no_surviving_blockers"
on_fail = "tests"
max_rounds = 2

[[stage]]
id = "build"
role = "builder"
reads = ["plan"]                # never the tests
record = "build_note"

[[stage]]
id = "verify"
role = "verifier"
reads = ["diff", "tests?", "build?"]
record = "verify_record"
gate = "verify_green"
on_fail = "build"
max_rounds = 3

[[stage]]
id = "review"
kind = "review"
target = "diff"
reads = ["diff", "plan?", "verify"]
record = "review_record"
lenses = ["correctness", "tests", "security", "data", "boundaries"]
defenders = 3
survive_if_unrefuted_by = 2     # a blocker stands when at least 2 of the 3 defenders fail to refute it
detective = true                # runs only once no blocker stands
gate = "no_surviving_blockers"
on_fail = "build"
max_rounds = 3

[[stage]]
id = "reduce"
role = "main"
reads = ["intake", "verify?", "review?"]   # reduces whatever the row produced
record = "pass_record"
gate = "all_gates_passed"

# Rows: which stages run for which change. A row selects stages; it never reorders them.
# Reordering means reordering the [[stage]] blocks above.
[matrix.docs]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["docs"]

[matrix.config]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["security", "boundaries"]

[matrix.tests]
stages = ["intake", "verify", "review", "reduce"]
lenses = ["tests"]

[matrix.code.S]
stages = ["intake", "plan", "tests", "build", "verify", "review", "reduce"]
lenses = ["correctness", "tests"]

[matrix.code.M]
stages = ["intake", "plan", "tests", "test-review", "build", "verify", "review", "reduce"]

[matrix.code.L]
stages = ["intake", "plan"]
note = "The planner proposes a split into changes of size M or smaller; nothing is built at size L."
